name: App testing

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.sha }}
  cancel-in-progress: ${{ !contains(github.ref, 'master') }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Lint code
        run: bash ./gradlew lint --stacktrace
      - name: Unit tests
        run: bash ./gradlew testDebugUnitTest --stacktrace
  apk:
    name: Generate signed release APK
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KISS_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KISS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KISS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KISS_RELEASE_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Missing KISS_RELEASE_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?Missing KISS_RELEASE_STORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing KISS_RELEASE_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing KISS_RELEASE_KEY_PASSWORD}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kiss-release.jks"
          echo "KISS_RELEASE_STORE_FILE=$RUNNER_TEMP/kiss-release.jks" >> "$GITHUB_ENV"
          echo "KISS_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KISS_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KISS_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build release APK
        run: bash ./gradlew assembleRelease --stacktrace
      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: KISS-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          archive: false
