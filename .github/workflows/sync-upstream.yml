name: Sync upstream and build signed APK

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out fork
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Merge latest upstream
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Neamar/KISS.git
          git fetch upstream master
          git merge --no-edit upstream/master

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KISS_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KISS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KISS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KISS_RELEASE_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Missing KISS_RELEASE_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?Missing KISS_RELEASE_STORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing KISS_RELEASE_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing KISS_RELEASE_KEY_PASSWORD}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kiss-release.jks"
          echo "KISS_RELEASE_STORE_FILE=$RUNNER_TEMP/kiss-release.jks" >> "$GITHUB_ENV"
          echo "KISS_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KISS_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KISS_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Test and build release APK
        run: ./gradlew lint testDebugUnitTest assembleRelease --stacktrace

      - name: Stage artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/KISS-release.apk

      - name: Push merged upstream changes
        run: git push origin HEAD:master

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: KISS-release-${{ github.run_number }}
          path: artifacts/KISS-release.apk
          archive: false
          retention-days: 30
