name: Upload app to releases

# https://docs.github.com/en/webhooks/webhook-events-and-payloads#release
on:
  release:
    types: [edited, published]

concurrency:
  # Concurrency group that uses the workflow name and PR number if available
  # or commit SHA as a fallback. If a new workflow is triggered under that
  # concurrency group while a previous workflow is running it will be canceled.
  group: ${{ github.workflow }}-${{ github.ref || github.event.release.tag_name || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # create app and upload it to the published release
  upload:
    runs-on: ubuntu-latest
    env:
      ARCHIVE_NAME: ${{ github.event.repository.name }}-${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Create Release Directory
        run: mkdir -p release

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KISS_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KISS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KISS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KISS_RELEASE_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Missing KISS_RELEASE_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?Missing KISS_RELEASE_STORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing KISS_RELEASE_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing KISS_RELEASE_KEY_PASSWORD}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kiss-release.jks"
          echo "KISS_RELEASE_STORE_FILE=$RUNNER_TEMP/kiss-release.jks" >> "$GITHUB_ENV"
          echo "KISS_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KISS_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KISS_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Validate
        run: |
          bash ./gradlew lint --stacktrace
          bash ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        run: |
          bash ./gradlew assembleRelease --stacktrace
          cp "app/build/outputs/apk/release/app-release.apk" "release/KISS-release.apk"

      - name: Upload Files
        run: >
          gh release upload
          --clobber "${{ github.event.release.tag_name }}"
          --repo "${{ github.repository }}"
          release/*
